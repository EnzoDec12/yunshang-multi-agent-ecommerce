[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-multi-agent"
version = "0.1.0"
description = "Enterprise E-Commerce Multi-Agent System Foundation: Core Contracts & Tool Runtime Harness"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.9.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=1.0.0",
    "litellm>=1.60.0",
    "mcp>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "ruff>=0.9.0",
]
postgres = [
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
]
observability = [
    "langfuse>=2.50.0",
]

[project.scripts]
mcp-pim-server = "mcp_servers.pim_server:main"
mcp-oms-server = "mcp_servers.oms_server:main"
mcp-logistics-server = "mcp_servers.logistics_server:main"
mcp-bi-server = "mcp_servers.bi_server:main"
mcp-market-erp-server = "mcp_servers.market_erp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "infra*",
    "gateway*",
    "agents*",
    "runtime*",
    "mcp_servers*",
    "schemas*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    ".demo-runtime",
    "web",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

